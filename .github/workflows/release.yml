# Baut bei jedem Versions-Tag die fertigen Dateien und haengt sie an ein Release.
#
# Warum das hier laeuft und nicht auf dem Entwicklungsrechner:
#   * Niemand soll etwas selbst bauen muessen — weder die Nutzer noch der Entwickler.
#   * Die .exe braucht Windows, das AppImage braucht Linux. Kein Rechner hat beides.
#   * Frueher hing die veroeffentlichte .exe vier Versionen hinter dem Code, weil
#     "Tag pushen" und "Release anlegen" zwei verschiedene Dinge sind. Jetzt ist es
#     eines.
#
# Ausloesen:  git tag v2.0.0 && git push origin v2.0.0

name: Release bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # zum Ausprobieren auch von Hand startbar
  workflow_call:              # aufgerufen von "geplant.yml" (Release nach Zeitplan)
    inputs:
      tag:
        description: 'Welcher Tag gebaut werden soll, z. B. v2.1.0'
        required: true
        type: string

# ⚠⚠ Die **direkten** Werkzeuge stehen hier mit fester Version — und die
# Actions weiter unten mit ihrem Commit-SHA statt mit `@v4`.
#
# Warum: Ein Tag laesst sich verschieben, ein Commit-SHA nicht. Und
# `pip install --upgrade pyinstaller` holt bei jedem Lauf, was gerade neu ist —
# damit ergibt ein zweiter Bau desselben Tags nicht zwingend dieselbe Datei.
#
# Nachgemessen am 10.09.2026 mit `git ls-remote --tags`: Die beweglichen Tags
# (`v4`, `v5`, `v2`) zeigten zu diesem Zeitpunkt auf **genau** die SHAs, die
# unten stehen. Es wurde also festgeschrieben, was ohnehin lief — nichts
# aktualisiert.
#
# ⚠⚠ **Seit dem 11.09.2026 sind auch die Unterabhaengigkeiten festgenagelt.**
# `packaging/lock-windows.txt` und `packaging/lock-linux.txt` nennen jedes
# Paket mit Version und SHA-256; installiert wird mit `--require-hashes`.
# Damit liegen `altgraph`, `packaging`, `setuptools`,
# `pyinstaller-hooks-contrib` und unter Windows `pefile` und
# `pywin32-ctypes` ebenfalls fest.
#
# ⚠ **Je Plattform eine eigene Datei, erzeugt auf der Plattform selbst.**
# Die Windows-Pakete haengen an `sys_platform == "win32"`; ein anderswo
# erzeugter Lock laesst sie weg, und der Bau bricht. Dafuer gibt es den
# Ablauf `sperrdateien.yml` — er laeuft auf beiden Systemen und haengt die
# Ergebnisse als Anhang an. **Nach jedem Anheben eines Werkzeugs neu laufen
# lassen und die Dateien einchecken.**
#
# ⚠ Was weiterhin NICHT festliegt: das Betriebssystem der Bau-Rechner, die
# Python-Punktversion, `apt`-Pakete im Linux-Container und Inno Setup unter
# Windows. „Reproduzierbar" waere also weiter zu viel gesagt — festgenagelt
# ist die Python-Seite der Lieferkette.
#
# Anheben ist Handarbeit und Absicht: SHA UND den Kommentar daneben aendern.
# `tools/selbsttest.py` (Pruefung 178) haelt fest, dass hier nichts wieder
# beweglich wird.
env:
  # Der Tag steht je nach Ausloeser woanders: beim Push in github.ref_name,
  # beim Aufruf aus geplant.yml in inputs.tag. Ab hier gilt nur noch TAG.
  TAG: ${{ inputs.tag || github.ref_name }}
  PY_PYINSTALLER: '6.22.2'
  PY_PYFLAKES: '3.4.0'
  PY_PIP: '26.2.1'
  # AppImageTool: feste Fassung statt des beweglichen `continuous`-Links.
  # ⚠ Das Nachfolge-Repo — `AppImage/AppImageKit` ist abgeloest, seine aelteren
  # Anhaenge tragen dort bereits `obsolete-` im Namen.
  APPIMAGETOOL_VERSION: '1.9.1'
  # Selbst nachgerechnet am 10.09.2026 (Datei geladen, `shasum -a 256`), nicht
  # von der Seite abgeschrieben.
  APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
  # ⚠⚠ **Die Runtime ist der zweite Netzzugriff, den AppImageTool macht — und
  # der faellt leicht unter den Tisch.** Ohne `--runtime-file` laedt es die
  # Runtime beim Schnueren selbst nach (`fetch_runtime()` in seinem Quelltext),
  # und zwar die jeweils neueste. Sie landet als erstes Stueck IM fertigen
  # AppImage: Man haette also ein festgenageltes Werkzeug, das trotzdem jedes
  # Mal etwas anderes ausliefert.
  #
  # Deshalb das **datierte** Release `20251108` statt `continuous` — plus
  # Pruefsumme, ebenfalls selbst nachgerechnet.
  RUNTIME_VERSION: '20251108'
  RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'

permissions:
  contents: write             # noetig, um das Release anzulegen

jobs:

  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Die Adresse, an die ein Fehlerbericht auf Knopfdruck geht. Sie steht
      # NICHT im Quelltext — wer sie hat, kann in den Kanal schreiben. Hier
      # wird sie aus dem Secret in die Datei geschrieben, die dann mitgebaut
      # wird. Fehlt das Secret, bleibt sie leer und der Knopf erscheint gar
      # nicht erst (`berichtziel.moeglich()`).

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # ⚠ 3.14 ist Absicht, keine Modepflege: Erst ab dieser Fassung
          # bringt Python `compression.zstd` in der Standardbibliothek mit —
          # und genau das braucht `scbp/spieltexte.py`, um die englische
          # `global.ini` aus CIGs `Data.p4k` zu holen (CIG komprimiert mit
          # zstd). Mit 3.12 blieb dem Nutzer nur „installier dir 7-Zip", und
          # damit stand jeder vor einer Wand, der englisch spielt und bloss die
          # Angaben am Gegenstand haben will.
          python-version: '3.14'

      - name: Version gegen den Tag pruefen
        if: inputs.tag != '' || github.ref_type == 'tag'
        run: python .github/scripts/version_pruefen.py ${{ env.TAG }}

      # pyflakes findet Zugriffe auf Namen, die es nicht gibt — Fehler, die
      # sonst erst beim Klicken auffliegen. Ohne das Paket ueberspringt der
      # Selbsttest diese Pruefung stillschweigend; vor einem Release soll sie
      # aber wirklich laufen.
      - name: Werkzeuge aus der Sperrdatei
        # ⚠⚠ `--require-hashes` verlangt, dass JEDES Paket mit Pruefsumme
        # dasteht — auch `pefile` und `pywin32-ctypes`, die es nur unter
        # Windows gibt. Deshalb hat jede Plattform ihre eigene Datei, erzeugt
        # auf der Plattform selbst (Ablauf "Sperrdateien bauen").
        #
        # Hier kommen pyflakes UND PyInstaller in einem Rutsch: pyflakes wird
        # gleich fuer den Selbsttest gebraucht, PyInstaller erst spaeter —
        # zwei Laeufe mit derselben Sperrdatei waeren nur doppelte Zeit.
        run: |
          pip install --quiet --require-hashes -r packaging/lock-windows.txt
          pip list

      - name: Selbsttest
        run: python tools/selbsttest.py

      - name: Berichtsziel einsetzen
        shell: bash
        run: |
          # ⚠ Nur die eine Zeile ersetzen, die Datei NICHT neu schreiben.
          # Sonst fehlt in der gebauten Fassung alles andere — etwa die
          # Umgebungsvariable `SC_BP_BERICHT_ZIEL`, mit der sich der Weg aus
          # dem Quellcode heraus prüfen lässt. Zwei Fassungen derselben Datei,
          # die auseinanderlaufen, sind genau die Sorte Fehler, die niemand
          # sucht.
          python - <<'PYEOF'
          import io
          p = 'scbp/berichtziel.py'
          t = io.open(p, encoding='utf-8').read()
          alt = "WEBHOOK = ''"
          neu = "WEBHOOK = '${{ secrets.BERICHT_WEBHOOK }}'"
          assert alt in t, 'Platzhalter nicht gefunden'
          io.open(p, 'w', encoding='utf-8').write(t.replace(alt, neu, 1))
          print('Ziel eingesetzt:', 'ja' if len(neu) > len(alt) else 'leer')
          PYEOF

      - name: EXE bauen
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "SC-BP-Watcher" --icon "icon.ico"
          --add-data "CHANGELOG.en.md;." --add-data "CHANGELOG.md;."
          --add-data "assets/icon.png;assets" --add-data "assets/xharig.png;assets" --add-data "icon.ico;."
          --add-data "assets/symbole;assets/symbole"
          --add-data "daten;daten"
          sc_bp_watcher.py

      # Installer bauen. Inno Setup ist auf den Windows-Baurechnern von GitHub
      # vorinstalliert; falls nicht, wird es nachgeholt statt den Bau abzubrechen.
      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup fehlt — wird geholt"
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          # ⚠⚠ Die Version kommt aus __version__, NICHT aus dem Tag. Bei einem
          # Lauf von Hand gibt es keinen Tag — dann steht in github.ref_name der
          # Zweigname, und Inno Setup bricht mit "Value of [Setup] section
          # directive VersionInfoVersion is invalid" ab, weil aus "in-arbeit"
          # keine Dateiversion wird. Genau daran ist der im Projekt
          # beschriebene Weg "bauen ohne Release" bei JEDEM Versuch gescheitert
          # (vier von vier, gemessen am 03.09.2026) — und es fiel nie auf, weil
          # der Linux-Teil durchlief und alle echten Bauten ueber einen Tag
          # kamen. Bei einem Tag-Lauf ist beides ohnehin dasselbe: Der Schritt
          # "Version pruefen" laesst den Bau gar nicht erst weiterlaufen, wenn
          # Tag und __version__ auseinandergehen.
          $roh = Get-Content sc_bp_watcher.py -Raw
          $version = [regex]::Match($roh, "__version__\s*=\s*'([^']+)'").Groups[1].Value
          if (-not $version) { throw "__version__ nicht gefunden" }
          Write-Host "Installer-Version: $version"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows
          path: |
            dist/SC-BP-Watcher.exe
            dist/SC-BP-Watcher-Setup.exe

  # -------------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-latest
    # Gebaut wird IM Container mit Ubuntu 22.04 (glibc 2.35), nicht auf dem
    # Runner: Ein auf neuerem glibc gebautes AppImage startet auf aelteren
    # Systemen gar nicht — und die sind verbreiteter als das neueste.
    container: ubuntu:22.04
    env:
      # Ohne das fragt `tzdata` beim Installieren interaktiv nach der Zeitzone
      # und wartet ewig auf eine Eingabe, die im Bau nie kommt. Kostete beim
      # ersten Probelauf acht Minuten, bis der Job abgebrochen wurde.
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -qq
          # python3-dev ist noetig, weil PyInstaller die Python-Bibliothek selbst
          # einpackt (libpython3.x.so). Im schlanken Container fehlt sie sonst.
          # xvfb liefert den Bildschirm fuer den Selbsttest.
          apt-get install -y -qq --no-install-recommends \
            software-properties-common gpg-agent \
            binutils file wget ca-certificates git xvfb
          # ⚠ Python 3.14 statt der 3.10 aus Ubuntu 22.04 — wegen
          # `compression.zstd` (siehe Windows-Job). Der **Container** bleibt
          # bewusst 22.04: Sein altes glibc ist der Grund, warum das AppImage
          # auch auf betagteren Systemen startet. Nur das Python ist neuer.
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3.14 python3.14-dev python3.14-tk python3.14-venv
          update-alternatives --install /usr/bin/python3 python3 \
            /usr/bin/python3.14 1
          # ⚠⚠ Hier stand `wget -qO- .../get-pip.py | python3.14` — ein Skript
          # aus dem Netz, ungesehen ausgefuehrt, mit vollem Zugriff auf den
          # Bau-Rechner. Wer diese Quelle einmal uebernimmt, baut in JEDE
          # veroeffentlichte Datei mit, und niemand wuerde es bemerken.
          #
          # `ensurepip` macht dasselbe aus dem bereits installierten Python
          # heraus (Paket `python3.14-venv`, oben mitinstalliert) — kein
          # Download, keine Pipe.
          python3.14 -m ensurepip --upgrade
          # Feste Version: siehe die Begruendung im Kopf dieser Datei.
          python3.14 -m pip install --quiet "pip==${PY_PIP}"
          python3 -c "import compression.zstd; print('zstd in der Standardbibliothek: ok')"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # ⚠⚠ **Erst NACH dem Auschecken** — die Sperrdatei liegt im Repo.
      # Vorher stand die Installation weiter oben; mit einer Sperrdatei geht
      # das nicht mehr, und das ist der einzige Grund fuer die Umstellung.
      - name: Werkzeuge aus der Sperrdatei
        # ⚠ `--require-hashes` verlangt, dass JEDES Paket mit Pruefsumme
        # dasteht — auch die Unterabhaengigkeiten. Fehlt eines, bricht der Bau
        # ab. Genau das ist der Zweck: laut ist besser als still.
        # Neue Sperrdateien erzeugt der Ablauf "Sperrdateien bauen".
        run: |
          python3.14 -m pip install --quiet --require-hashes \
            -r packaging/lock-linux.txt
          python3.14 -m pip list

      # Dasselbe wie im Windows-Job — siehe die Begruendung dort.

      - name: Selbsttest
        # xvfb-run stellt einen Bildschirm bereit, den es auf einem Bau-Rechner
        # sonst nicht gibt. Ohne ihn wuerden die Fenster-Pruefungen still
        # uebersprungen — geprueft werden soll aber alles.
        run: xvfb-run -a python3 tools/selbsttest.py

      - name: Berichtsziel einsetzen
        shell: bash
        run: |
          # ⚠ Nur die eine Zeile ersetzen, die Datei NICHT neu schreiben.
          # Sonst fehlt in der gebauten Fassung alles andere — etwa die
          # Umgebungsvariable `SC_BP_BERICHT_ZIEL`, mit der sich der Weg aus
          # dem Quellcode heraus prüfen lässt. Zwei Fassungen derselben Datei,
          # die auseinanderlaufen, sind genau die Sorte Fehler, die niemand
          # sucht.
          python3 - <<'PYEOF'
          import io
          p = 'scbp/berichtziel.py'
          t = io.open(p, encoding='utf-8').read()
          alt = "WEBHOOK = ''"
          neu = "WEBHOOK = '${{ secrets.BERICHT_WEBHOOK }}'"
          assert alt in t, 'Platzhalter nicht gefunden'
          io.open(p, 'w', encoding='utf-8').write(t.replace(alt, neu, 1))
          print('Ziel eingesetzt:', 'ja' if len(neu) > len(alt) else 'leer')
          PYEOF

      - name: Binaerdatei bauen
        run: >
          python3 -m PyInstaller --noconfirm --onefile --windowed
          --name "SC-BP-Watcher"
          --add-data "CHANGELOG.en.md:." --add-data "CHANGELOG.md:."
          --add-data "assets/icon.png:assets" --add-data "assets/xharig.png:assets"
          --add-data "assets/symbole:assets/symbole"
          --add-data "daten:daten"
          sc_bp_watcher.py

      - name: AppImage schnueren
        run: |
          set -e
          APPDIR=SC-BP-Watcher.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp dist/SC-BP-Watcher "$APPDIR/usr/bin/"
          cp assets/icon.png "$APPDIR/sc-bp-watcher.png"

          # Beide Dateien liegen als echte Dateien im Repo (packaging/) — so
          # lassen sie sich lesen und aendern, ohne YAML anzufassen.
          cp packaging/sc-bp-watcher.desktop "$APPDIR/"
          cp packaging/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # ⚠⚠ Feste Fassung statt des beweglichen `continuous`-Links, und die
          # geladene Datei wird VOR der Benutzung geprueft. Bisher wurde hier
          # ein Programm aus dem Netz geholt und sofort ausgefuehrt, ohne dass
          # irgendetwas sagen konnte, ob es dasselbe wie beim letzten Mal ist.
          #
          # Stimmt die Pruefsumme nicht, bricht der Bau ab — `sha256sum -c`
          # liefert dann einen Fehler, und `set -e` ganz oben beendet den
          # Schritt. Das ist gewollt: lieber kein AppImage als ein fremdes.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

          # Und die Runtime dazu — sonst holt AppImageTool sie selbst aus dem
          # Netz und packt eine unbestimmte Fassung in unser AppImage.
          # ⚠ Die Pruefung steht VOR dem Weiterverwenden, nicht danach.
          wget -q "https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_VERSION}/runtime-x86_64"
          echo "${RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -

          # --appimage-extract-and-run, weil im Container kein FUSE zur Verfuegung steht
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            --runtime-file runtime-x86_64 \
            "$APPDIR" SC-BP-Watcher-x86_64.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux
          path: SC-BP-Watcher-x86_64.AppImage

  # ------------------------------------------------------------------ Release
  release:
    needs: [windows, linux]
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        # ⚠ Mit voller Historie und Tags: `release_text.py` sucht die vorige
        # Testfassung, um „was hat sich seit dann geändert" zu verlinken. Ein
        # flacher Klon kennt keine Tags, und der Link fiele still weg.
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: { path: dateien }

      - name: Beschreibung aus dem CHANGELOG holen
        # Der Abschnitt zur getaggten Version wird zum Release-Text — dadurch
        # steht im Werkzeug unter "Was ist neu" dasselbe wie auf GitHub.
        run: >
          python3 .github/scripts/release_text.py ${{ env.TAG }}
          > release-text.md

      - name: Vorabversion?
        id: art
        # Ein Tag mit -rc, -beta oder -alpha wird auf GitHub als Vorabversion
        # gekennzeichnet. Das Werkzeug bietet solche Fassungen niemandem
        # ungefragt als Update an — sie sind zum Pruefen da, nicht zum Verteilen.
        run: |
          case "${{ env.TAG }}" in
            *-rc*|*-beta*|*-alpha*) echo "vorab=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "vorab=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pruefsummen erzeugen
        # ⚠⚠ **Ohne diese Datei bekommt niemand mehr ein automatisches
        # Update.** Seit P1 gilt im Programm: keine gueltige Pruefsumme, keine
        # Installation. Das ist so gewollt und deshalb streng — aber es heisst
        # auch, dass dieser Schritt bei JEDEM Release laufen muss.
        #
        # ⚠ Die Namen stehen ohne Ordner in der Datei (`cd` statt Pfadangabe):
        # Der Updater sucht darin nach dem reinen Dateinamen des Anhangs, so
        # wie GitHub ihn ausliefert. Mit `dateien/windows/…` davor faende er
        # seinen Eintrag nie und wuerde jedes Update ablehnen.
        run: |
          set -eu
          ( cd dateien/windows && sha256sum SC-BP-Watcher-Setup.exe ) \
            > SHA256SUMS.txt
          ( cd dateien/linux && sha256sum SC-BP-Watcher-x86_64.AppImage ) \
            >> SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          # Gegenprobe: zwei Zeilen, sonst fehlt eine Datei.
          test "$(wc -l < SHA256SUMS.txt)" = "2"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          prerelease: ${{ steps.art.outputs.vorab }}
          body_path: release-text.md
          # ⚠ Die nackte `SC-BP-Watcher.exe` wird NICHT mehr angehängt
          # (bewusste Entscheidung, 27.08.2026: „ich will die exe ohne install
          # loswerden … nun wollen wir es funktionierend und einfach").
          #
          # Sie war seinerzeit dazu da, Vertrauen aufzubauen — ein unsigniertes
          # Programm ohne Installer wirkt harmloser. Das Argument ist
          # verbraucht, und zwei Auslieferungswege heißen zwei Fehlerquellen
          # und doppelte Unterstützung.
          #
          # Der Weg für **v2.0.0** bleibt trotzdem offen: Deren Update-Logik
          # greift die erste Datei auf `.exe` — das ist jetzt der Installer —
          # und ihr Hilfsskript **startet** die getauschte Datei
          # (`start "" "<ziel>"`). Der Installer läuft also und installiert
          # sauber, statt als totes Programm liegenzubleiben.
          files: |
            dateien/windows/SC-BP-Watcher-Setup.exe
            dateien/linux/SC-BP-Watcher-x86_64.AppImage
            SHA256SUMS.txt

      # Meldung im eigenen Discord — als lesbare Karte statt als nackter Link.
      #
      # Laeuft **nach** dem Release, damit der Link im Beitrag schon zieht. Ohne
      # hinterlegten Schluessel passiert nichts und der Bau bleibt gruen: Eine
      # Chat-Meldung darf eine fertige Veroeffentlichung nicht rot faerben.
      #
      # ⚠ Der Beitrag landet nur im EIGENEN Discord. Ob ihn jemand anderes
      # sieht, entscheidet weiterhin ein Klick auf „Veroeffentlichen" — diese
      # Bremse ist gewollt (siehe Projektnotizen).
      - name: Im Discord melden
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 .github/scripts/discord_release.py "${GITHUB_REF_NAME}"
