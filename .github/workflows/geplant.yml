# Prueft, ob eine Fassung fertig ist — veroeffentlicht aber NICHTS von selbst.
#
# ⚠ Der Zeitplan ist am 25.08.2026 abgeschaltet worden. Gemeldet: "Release machen wir
# jeden Samstag um 12 Uhr, stossen den aber selber an, kein Auto-Release, ist zu
# vage, ist besser wir machen das selber." Und das stimmt: Ein Ablauf, der von
# allein taggt, entscheidet anhand von Changelog-Datum und Versionsnummer — beides
# sagt nichts darueber, ob die Fassung wirklich gut ist. Am Samstag steht ausserdem
# oft ein frischer Spiel-Patch an; ob der noch mit hineingehoert, weiss nur ein
# Mensch.
#
# Was bleibt: Der Ablauf laesst sich von Hand starten und sagt, ob alles beisammen
# ist (Versionsnummer, beide Changelogs, Datum erreicht). Veroeffentlicht wird nur,
# wenn man den Trockenlauf ausdruecklich abwaehlt.
#
# Der uebliche Weg zum Release ist und bleibt:
#   git tag v3.0.0 && git push origin v3.0.0
#
# Warum es diesen Ablauf ueberhaupt gibt:
#   Ein Tag, den ein Ablauf mit dem Standard-Token setzt, loest KEINEN weiteren
#   Ablauf aus (GitHub verhindert damit Endlosschleifen). "Tag pushen und hoffen,
#   dass release.yml anspringt" funktioniert also nicht. Deshalb ruft dieser
#   Ablauf den Bau selbst auf — release.yml kann das seit dem Umbau (workflow_call).
#
# Woran es NICHT scheitern soll:
#   Jeden Samstag blind zu taggen waere schlimmer als gar keine Automatik. Ueber
#   die Freigabe entscheidet `release_faellig.py`: Es muss eine neue Nummer in
#   `__version__` stehen, dazu in BEIDEN CHANGELOG-Dateien ein Abschnitt mit einem
#   Datum, das erreicht ist. Fehlt eines davon, passiert nichts.
#
# Von Hand ausprobieren: Actions -> "Release nach Zeitplan" -> Run workflow.
# Der Trockenlauf ist dabei voreingestellt und veroeffentlicht nichts.

name: Release-Bereitschaft pruefen

on:
  # ⚠ KEIN `schedule` mehr — siehe Kopf. Der Zeitplan stand hier:
  #     - cron: '0 10 * * 6'   (Sommerzeit, samstags 12:00 deutscher Zeit)
  #     - cron: '0 11 * * 6'   (Winterzeit)
  # Wer ihn je wieder will, setzt beide Zeilen zurueck; die Uhrzeitpruefung
  # weiter unten faengt die jeweils falsche ab.
  workflow_dispatch:
    inputs:
      trockenlauf:
        description: 'Nur nachsehen, nichts veroeffentlichen'
        type: boolean
        default: true

permissions:
  contents: write             # noetig, um den Tag zu setzen

jobs:

  pruefen:
    runs-on: ubuntu-latest
    outputs:
      faellig: ${{ steps.pruefung.outputs.faellig }}
      tag:     ${{ steps.pruefung.outputs.tag }}
      grund:   ${{ steps.pruefung.outputs.grund }}
    steps:
      # ⚠ Commit-SHA statt `@v4` — ein Tag laesst sich verschieben, ein SHA
      # nicht. Die Fassung steht als Kommentar daneben; Anheben ist Handarbeit.
      # Begruendung ausfuehrlich im Kopf von `release.yml`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0      # ohne die Tags kann nicht geprueft werden, was schon draussen ist

      - name: Ist es in Deutschland gerade 12 Uhr?
        # Nur fuer die geplanten Laeufe. Von Hand gestartet wird nicht auf die Uhr gesehen.
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          jetzt = datetime.now(ZoneInfo('Europe/Berlin'))
          print('In Deutschland ist es %s Uhr.' % jetzt.strftime('%H:%M'))
          if jetzt.hour != 12:
              print('Das ist der Lauf fuer die andere Jahreszeit — hier ist nichts zu tun.')
              sys.exit(78)
          PY

      - name: Faellig?
        id: pruefung
        run: python3 .github/scripts/release_faellig.py

      - name: Ergebnis in die Zusammenfassung
        run: |
          {
            echo "### Release nach Zeitplan"
            echo ""
            if [ "${{ steps.pruefung.outputs.faellig }}" = "true" ]; then
              echo "**${{ steps.pruefung.outputs.tag }}** ist faellig — ${{ steps.pruefung.outputs.grund }}."
            else
              echo "Nichts veroeffentlicht: ${{ steps.pruefung.outputs.grund }}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  taggen:
    needs: pruefen
    if: needs.pruefen.outputs.faellig == 'true' && inputs.trockenlauf != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with: { fetch-depth: 0 }

      - name: Tag setzen und hochladen
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${{ needs.pruefen.outputs.tag }}"
          git push origin "${{ needs.pruefen.outputs.tag }}"

  bauen:
    needs: [pruefen, taggen]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.pruefen.outputs.tag }}
    permissions:
      contents: write
