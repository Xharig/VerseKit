# Checks every push to main without building a release: clippy, the tests that run without a window, nothing
# private in the repository, the German and English documents in step. The release build stays untouched: it
# builds, this one checks.
#
# Rules of this file as in release.yml: actions pinned to a commit, the job only reads the repository, no ${{ }}
# inside `run:` (values come through `env:`), the deploy key of the p4kx repository only through ssh-agent,
# never printed and never part of an artifact.

name: Pruefung

on:
  push:
    branches: [main]

env:
  RUST_VERSION: '1.99.1'
  CARGO_TERM_COLOR: never

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd  # v0.9.1
        with:
          ssh-private-key: ${{ secrets.P4KX_DEPLOY_KEY }}

      - name: Fetch p4kx over SSH
        run: git config --global url."ssh://git@github.com/p4kx-org/".insteadOf "https://github.com/p4kx-org/"

      - name: Rust
        run: |
          rustup toolchain install "$env:RUST_VERSION" --profile minimal --component clippy
          rustup default "$env:RUST_VERSION"
          rustc --version

      - name: Clippy
        run: cargo clippy --release --workspace --locked -- -D warnings

      # The same tests as in release.yml, plus the language files; none of them opens a window.
      - name: Tests without a window
        run: |
          cargo test --locked -p versekit-gamedata --test no_key
          cargo test --locked -p versekit-app
          cargo test --locked -p versekit-core --lib -- updater update_run update_helper update_swap auto_update autostart backup provenance
          cargo test --locked -p versekit-core --test language_files

      - name: Nothing private in the repository
        # Prints file, line and rule, never the text that was found.
        run: python tools/privacy_scan.py

      - name: German and English in step
        run: python tools/sprachen_pruefen.py
